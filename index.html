<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kakobuy Spreadsheet – Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #F6EFFF; --bg-bottom: #E4D8F7;
    --ink: #24163B; --muted: #675584;
    --card: rgba(255,255,255,.72); --card-line: rgba(36,22,59,.14);
    --accent: #F26A0F; --accent-2: #FFB347; --on-accent: #2A1500;
    --moon: #FFE7A3; --moon-ink: #4A3410; --crater: rgba(120,80,20,.16);
    --glow: rgba(255,179,71,.55); --star: rgba(36,22,59,.18); --bat: #3B2766;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1B1030; --bg-bottom: #0E0818;
      --ink: #F6EFFF; --muted: #B7A8D4;
      --card: rgba(255,255,255,.06); --card-line: rgba(255,255,255,.14);
      --accent: #FF7A1A; --accent-2: #FFB347; --on-accent: #2A1500;
      --moon: #FFE7A3; --moon-ink: #4A3410; --crater: rgba(120,80,20,.2);
      --glow: rgba(255,200,110,.45); --star: rgba(255,255,255,.55); --bat: #0A0612;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1B1030; --bg-bottom: #0E0818;
    --ink: #F6EFFF; --muted: #B7A8D4;
    --card: rgba(255,255,255,.06); --card-line: rgba(255,255,255,.14);
    --accent: #FF7A1A; --accent-2: #FFB347; --on-accent: #2A1500;
    --moon: #FFE7A3; --moon-ink: #4A3410; --crater: rgba(120,80,20,.2);
    --glow: rgba(255,200,110,.45); --star: rgba(255,255,255,.55); --bat: #0A0612;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    font-family: "DM Sans", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5;
    overflow-x: hidden;
  }
  .stars {
    position: absolute; inset: 0 0 auto 0; height: 360px; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, var(--star) 50%, transparent 52%),
      radial-gradient(1px 1px at 28% 62%, var(--star) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 41% 12%, var(--star) 50%, transparent 52%),
      radial-gradient(1px 1px at 63% 30%, var(--star) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 78% 14%, var(--star) 50%, transparent 52%),
      radial-gradient(1px 1px at 90% 52%, var(--star) 50%, transparent 52%),
      radial-gradient(1px 1px at 6% 70%, var(--star) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 88% 80%, var(--star) 50%, transparent 52%);
  }
  main { position: relative; max-width: 480px; margin: 0 auto; padding: 44px 20px 40px; text-align: center; }
  .hero { position: relative; height: 150px; margin-bottom: 14px; }
  .moon {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    width: 118px; height: 118px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 34%, var(--crater) 0 9px, transparent 10px),
      radial-gradient(circle at 68% 26%, var(--crater) 0 6px, transparent 7px),
      radial-gradient(circle at 62% 72%, var(--crater) 0 12px, transparent 13px),
      radial-gradient(circle at 24% 74%, var(--crater) 0 5px, transparent 6px),
      var(--moon);
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--moon) 14%, transparent), 0 0 70px 14px var(--glow);
    display: grid; place-items: center; overflow: hidden;
    font-family: "Bricolage Grotesque", Georgia, serif; font-weight: 800; font-size: 44px; color: var(--moon-ink);
  }
  .moon img { width: 100%; height: 100%; object-fit: cover; }
  .bat { position: absolute; fill: var(--bat); }
  .bat.b1 { left: 4%; top: 6px; width: 54px; transform: rotate(-12deg); }
  .bat.b2 { right: 6%; top: 52px; width: 40px; transform: rotate(10deg) scaleX(-1); }
  .bat.b3 { left: 18%; top: 96px; width: 26px; transform: rotate(8deg); opacity: .8; }
  .wordmark { margin: 0 0 4px; font-family: "Bricolage Grotesque", Georgia, serif; font-size: 1.05rem; color: var(--accent); }
  .wordmark b { font-weight: 800; }
  h1 {
    margin: 0 0 8px; font-family: "Bricolage Grotesque", Georgia, serif;
    font-weight: 800; font-size: 2.5rem; line-height: 1.05; letter-spacing: -0.02em;
  }
  .bio { margin: 0 auto 30px; max-width: 32ch; color: var(--muted); }
  .links { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  .links a {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 16px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--card-line); border-radius: 20px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    text-decoration: none;
    font-family: "Bricolage Grotesque", Georgia, serif; font-weight: 500; font-size: 1.05rem; line-height: 1.25;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .links a small {
    display: block; margin-top: 2px;
    font-family: "DM Sans", system-ui, sans-serif; font-size: .84rem; font-weight: 400; color: var(--muted);
  }
  .links a .text { flex: 1; min-width: 0; }
  .links a .tile {
    flex: none; width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
  }
  .links a .tile svg, .socials svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .links a .tile svg.solid, .socials svg.solid { fill: currentColor; stroke: none; }
  .links a .go { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
  .links a:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 30px -10px var(--glow); }
  .links li.featured a { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: var(--on-accent); border-color: transparent; }
  .links li.featured a small { color: rgba(42,21,0,.78); }
  .links li.featured a .tile { background: rgba(42,21,0,.14); color: var(--on-accent); }
  .links a .logo {
    flex: none; display: grid; place-items: center; width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent);
    font-family: "Bricolage Grotesque", Georgia, serif; font-size: .78rem; line-height: 1.05; text-align: center;
  }
  .links a .logo b { display: block; font-weight: 800; }
  a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
  .socials { display: flex; justify-content: center; gap: 12px; margin: 30px 0 0; padding: 0; list-style: none; }
  .socials a {
    display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%;
    color: var(--ink); background: var(--card); border: 1px solid var(--card-line); transition: transform .15s ease, color .15s ease;
  }
  .socials a:hover { transform: translateY(-2px); color: var(--accent); }
  .disclosure { margin: 30px auto 0; max-width: 42ch; font-size: .78rem; line-height: 1.5; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .links a, .socials a { transition: none; } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <div class="hero">
    <svg class="bat b1" viewBox="0 0 64 32" aria-hidden="true"><path id="batpath" d="M32 10c-2-5-5-8-9-8 2 3 2 6 1 8-4-4-10-5-16-3 4 1 7 4 8 8-3-1-6-1-9 1 6 1 9 4 11 9 3-2 6-1 8 2 1-3 3-5 6-5s5 2 6 5c2-3 5-4 8-2 2-5 5-8 11-9-3-2-6-2-9-1 1-4 4-7 8-8-6-2-12-1-16 3-1-2-1-5 1-8-4 0-7 3-9 8z"/></svg>
    <svg class="bat b2" viewBox="0 0 64 32" aria-hidden="true"><use href="#batpath"/></svg>
    <svg class="bat b3" viewBox="0 0 64 32" aria-hidden="true"><use href="#batpath"/></svg>
    <div class="moon" id="avatar" aria-hidden="true"></div>
  </div>
  <p class="wordmark"><b>Kako</b>Buy</p>
  <h1 id="name"></h1>
  <p class="bio" id="bio"></p>
  <ul class="links" id="links"></ul>
  <ul class="socials" id="socials"></ul>
  <p class="disclosure">Independent directory. We don't sell, ship or authenticate products. We may earn a commission if you create an account through our referral links, not on purchases.</p>
</main>

<script>
  // ✏️ EDIT THIS SECTION — everything on the page comes from here.
  const PROFILE = {
    name: "CIAOFINDZ",
    bio: "Spreadsheet, product finds, QC photos and community links in one place.",
    photo: "",
    links: [
      { icon: "sheet", title: "KakoBuy • CIAOFINDZ (2026) Best Spreadsheet", note: "The full product spreadsheet", url: "https://docs.google.com/spreadsheets/d/1HC2drz57DUw6tHKsq4tp8dK4wjIJvAJP5y6Ovymt9UU/edit?gid=0#gid=0", featured: true },
      { logo: true, title: "REGISTER HERE FOR BEST COUPONS -40%", note: "Sign up through this link to get your coupons", url: "https://ikako.vip/r/vhneu" },
      { icon: "discord", title: "Join the Discord", note: "Help and community", url: "https://discord.gg/Xuk5fgRu6" }
    ],
    socials: [
      { icon: "tiktok", label: "TikTok", url: "https://www.tiktok.com/@ciaofindz" },
      { icon: "discord", label: "Discord", url: "https://discord.gg/Xuk5fgRu6" }
    ]
  };

  const ICONS = {
    sheet: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',
    discord: '<path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>',
    tiktok: '<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.5 2.5 2 4 4.5 4.2"/>'
  };
  const svg = (inner, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); s.innerHTML = inner; return s; };
  const $ = id => document.getElementById(id);
  const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);

  $("name").textContent = PROFILE.name;
  $("bio").textContent = PROFILE.bio;

  const avatar = $("avatar");
  if (PROFILE.photo) avatar.appendChild(make("img", { src: PROFILE.photo, alt: "" }));
  else avatar.textContent = PROFILE.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

  PROFILE.links.forEach(l => {
    const li = make("li", { className: l.featured ? "featured" : "" });
    const a = make("a", { href: l.url });
    if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    if (l.logo) {
      const logo = make("span", { className: "logo" });
      logo.appendChild(make("b", { textContent: "Kako" }));
      logo.appendChild(document.createTextNode("Buy"));
      a.appendChild(logo);
    } else if (l.icon) {
      const tile = make("span", { className: "tile" });
      tile.appendChild(svg(ICONS[l.icon], l.icon === "discord" ? "solid" : ""));
      a.appendChild(tile);
    }
    const text = make("span", { className: "text", textContent: l.title });
    if (l.note) text.appendChild(make("small", { textContent: l.note }));
    a.appendChild(text);
    a.appendChild(svg('<path d="M9 6l6 6-6 6"/>', "go"));
    li.appendChild(a);
    $("links").appendChild(li);
  });

  PROFILE.socials.forEach(s => {
    const li = make("li");
    const a = make("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", title: s.label });
    a.setAttribute("aria-label", s.label);
    a.appendChild(svg(ICONS[s.icon], s.icon === "discord" ? "solid" : ""));
    li.appendChild(a);
    $("socials").appendChild(li);
  });
</script>
</body>
</html>
